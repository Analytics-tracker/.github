name: go-ci
on:
  workflow_call:
    inputs:
      go-version-file:
        type: string
        default: go.mod
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - uses: golangci/golangci-lint-action@v6
      - run: go test -race -count=1 ./...
      - run: go build ./...
